name: Build W17 Vial firmware
on:
  workflow_dispatch:
  push:
    paths:
      - 'firmware/**'
      - '.github/workflows/build-firmware.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10.14'
      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi libusb-1.0-0
      - name: Fetch pinned Vial-QMK and submodules
        run: |
          python -c 'import json; d=json.load(open("firmware/build-lock.json")); assert d["commit"] == "6113857745929875b69b565a845a2708bb1f4f46"'
          git init build/vial-qmk
          git -C build/vial-qmk remote add origin https://github.com/vial-kb/vial-qmk.git
          git -C build/vial-qmk fetch --depth 1 origin 6113857745929875b69b565a845a2708bb1f4f46
          git -C build/vial-qmk checkout --detach FETCH_HEAD
          git -C build/vial-qmk submodule update --init --depth 1 lib/chibios lib/chibios-contrib lib/printf
          cp -R firmware/qmk/w17 build/vial-qmk/keyboards/w17
      - name: Install QMK Python dependencies
        run: |
          python -m pip install 'qmk==1.1.2' -r build/vial-qmk/requirements.txt
      - name: Build firmware
        working-directory: build/vial-qmk
        run: make w17:vial -j2
      - name: Package corresponding source and build record
        run: |
          mkdir -p dist
          cp build/vial-qmk/w17_vial.bin dist/
          cp firmware/build-lock.json dist/
          python -m pip freeze > dist/python-packages.txt
          arm-none-eabi-gcc --version > dist/toolchain.txt
          git -C build/vial-qmk submodule status --recursive > dist/submodules.txt
          printf '%s\n' "$GITHUB_SHA" > dist/project-commit.txt
          tar --exclude='.git' --exclude='.build' --exclude='*.bin' --exclude='*.elf' -czf dist/w17-vial-corresponding-source.tar.gz -C build/vial-qmk .
          cd dist
          sha256sum w17_vial.bin w17-vial-corresponding-source.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: w17-vial-build
          path: dist/
          retention-days: 30
